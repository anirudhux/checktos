<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; }
    .card {
      width: 1200px; height: 630px; box-sizing: border-box;
      background: #ffffff; color: #1f231e; font-family: "Geist", sans-serif;
      padding: 74px 84px; display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
    }
    .top { display: flex; align-items: center; gap: 14px; }
    .mark { width: 40px; height: 40px; border-radius: 11px; background: #1f231e; display: flex; align-items: center; justify-content: center; }
    .mark svg { width: 24px; height: 24px; }
    .word { font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
    h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 82px; line-height: 1.05; margin: 0; max-width: 17ch; letter-spacing: -0.015em; }
    h1 .em { color: #2f5d47; }
    .foot { display: flex; align-items: flex-end; justify-content: space-between; font-size: 24px; color: #6b6d62; }
    .foot b { color: #1f231e; font-weight: 600; }
    .rule { position: absolute; left: 0; top: 0; width: 10px; height: 630px; background: #2f5d47; }
  </style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="top">
      <span class="mark"><svg viewBox="0 0 32 32"><path d="M9 16.5 l4.4 4.4 L23 10" fill="none" stroke="#2f5d47" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="word">CheckTOS</span>
    </div>
    <h1>Do you <span class="em">understand</span> the terms before you agree to them?</h1>
    <div class="foot">
      <span>A plain-language breakdown of any terms of service.</span>
      <span><b>checktos.com</b></span>
    </div>
  </div>
</body>
</html>
